[project]
name = "mouxue-zhiqi-backend"
version = "0.1.0"
description = "觅学之契 · 我的学习范式 — 后端（治理内核优先）"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
]
# `tools.seedui` 通过 TestClient 走真实 HTTP 端点造演示数据 —— 镜像的入口脚本
# 要用它，所以这一个运行时路径需要 httpx。单独成组，避免把整张 dev 依赖塞进镜像。
seed = [
    "httpx>=0.28",
]

# 扁平布局里 `app/` 与 `tools/` 都是顶层包。不显式声明，`pip install -e .`
# 会因"发现到多个顶层包"直接失败 —— 那会让 `scripts/dev.*` 与 Dockerfile
# 里的安装步骤全部断掉，而错误信息说的是"包发现"，不指向真正的原因。
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# 用 `find` 而不是手写列表：`app.agent`、`app.api` 这些子包必须一起进去，
# 只列顶层包会让镜像启动时才报 ImportError。
include = ["app*", "tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# 不加 `-q`：命令行再给一个 `pytest -q` 会叠成 `-qq`，pytest 会把
# "N passed" 那一行一起吞掉 —— 于是"这次跑了多少条"永远看不见。
addopts = "--strict-markers"
# 这条来自 starlette 自己（新版建议装 httpx2）。它是上游的迁移提醒，不是本项目的
# 问题，也没有可执行的修复动作 —— 留着它只会训练我们忽略 warnings 输出。
# 注意类别是 `UserWarning` 的子类（不是 DeprecationWarning），别按名字想当然。
filterwarnings = [
    "ignore:Using .httpx. with .starlette.testclient. is deprecated:UserWarning",
]
